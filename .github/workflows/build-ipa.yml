name: Build LocSim IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version

      - name: Install ldid
        run: brew install ldid

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project LocSimOnly.xcodeproj \
            -scheme Geranium \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages

      - name: Build (unsigned Release)
        run: |
          set -o pipefail
          xcodebuild \
            -project LocSimOnly.xcodeproj \
            -scheme Geranium \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            build

      - name: Verify app bundle
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Geranium.app"
          ls -la "$APP"
          test -f "$APP/Geranium"

      - name: Strip Apple signing leftovers
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Geranium.app"
          rm -rf "$APP/_CodeSignature" "$APP/embedded.mobileprovision" "$APP/PlugIns"

      - name: Sign with ldid + entitlements
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Geranium.app"
          ldid -S entitlements.plist "$APP/Geranium"
          chmod 755 "$APP/Geranium"
          if [ -f "$APP/GeraniumRootHelper" ]; then
            chmod 755 "$APP/GeraniumRootHelper"
            ldid -S entitlements.plist "$APP/GeraniumRootHelper"
          fi
          ldid -e "$APP/Geranium" | grep -E "locationd|platform-application|no-sandbox" || true

      - name: Package as IPA
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Geranium.app"
          rm -rf Payload LocSim.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry LocSim.ipa Payload
          unzip -l LocSim.ipa | head -40
          du -h LocSim.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocSim-ipa
          path: LocSim.ipa
          retention-days: 30
          if-no-files-found: error
