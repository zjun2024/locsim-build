name: Build LocSim IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install ldid
        run: |
          brew install ldid
          ldid -v || true

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project LocSimOnly.xcodeproj \
            -scheme Geranium \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages
          ls -la build/SourcePackages 2>/dev/null || true

      - name: Build unsigned Release arm64
        run: |
          set -o pipefail
          xcodebuild \
            -project LocSimOnly.xcodeproj \
            -scheme Geranium \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            build

      - name: Verify app bundle
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Geranium.app"
          ls -la "$APP"
          test -f "$APP/Geranium"

      - name: Strip Apple signing leftovers
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Geranium.app"
          rm -rf "$APP/_CodeSignature" "$APP/embedded.mobileprovision" "$APP/PlugIns"

      - name: Sign with ldid
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Geranium.app"
          # The bundled RootHelper is a pre-signed Apple binary: its legacy
          # code signature confuses ldid's ad-hoc signing path.
          if [ -f "$APP/GeraniumRootHelper" ]; then
            /usr/bin/codesign --remove-signature "$APP/GeraniumRootHelper" || true
          fi
          ldid -S entitlements.plist "$APP/Geranium"
          chmod 755 "$APP/Geranium"
          if [ -f "$APP/GeraniumRootHelper" ]; then
            chmod 755 "$APP/GeraniumRootHelper"
            ldid -S entitlements.plist "$APP/GeraniumRootHelper"
          fi
          ldid -e "$APP/Geranium" | grep -E "locationd|platform-application|no-sandbox" || true

      - name: Package IPA
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Geranium.app"
          rm -rf Payload LocSim.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry LocSim.ipa Payload
          unzip -l LocSim.ipa | head -40
          du -h LocSim.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocSim-ipa
          path: LocSim.ipa
          retention-days: 30
          if-no-files-found: error
