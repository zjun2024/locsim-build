name: Build LocSim IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project LocSimOnly.xcodeproj \
            -scheme Geranium \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages
          ls -la build/SourcePackages 2>/dev/null || true

      - name: Build Release (ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project LocSimOnly.xcodeproj \
            -scheme Geranium \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_ENTITLEMENTS="Geranium/Geranium.entitlements" \
            build

      - name: Verify app bundle and entitlements
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Geranium.app"
          ls -la "$APP"
          test -f "$APP/Geranium"
          echo "--- LC_CODE_SIGNATURE ---"
          /usr/bin/otool -l "$APP/Geranium" | grep -A 2 LC_CODE_SIGNATURE | head -6
          echo "--- embedded entitlements ---"
          /usr/bin/codesign -d --entitlements :- "$APP/Geranium" 2>&1 | sed -n '1,80p'

      - name: Strip Apple signing leftovers
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Geranium.app"
          rm -rf "$APP/_CodeSignature" "$APP/embedded.mobileprovision" "$APP/PlugIns"

      - name: Package IPA
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Geranium.app"
          rm -rf Payload LocSim.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry LocSim.ipa Payload
          unzip -l LocSim.ipa | head -40
          du -h LocSim.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocSim-ipa
          path: LocSim.ipa
          retention-days: 30
          if-no-files-found: error
